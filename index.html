<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projetos — Painel HTML Publicado</title>
<style>
  :root {
    --bg:#0b1220;
    --panel:#0f172a;
    --panel-2:#111b2d;
    --line:#1f2d42;
    --text:#e6e9ef;
    --muted:#8a93a6;
    --blue:#3b82f6;
    --green:#10b981;
    --amber:#f59e0b;
    --red:#ef4444;
    --purple:#7c3aed;
    --radius:14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial;
    background: radial-gradient(1200px 800px at 20% -10%, rgba(59,130,246,.18), transparent),
                radial-gradient(1000px 700px at 80% 10%, rgba(124,58,237,.15), transparent),
                var(--bg);
    color: var(--text);
  }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    padding: 18px 18px 14px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(15,23,42,.7), rgba(15,23,42,.4));
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 50;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .2px; }
  header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .board {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 18px;
    margin-top: 22px;
  }
  .card {
    background: linear-gradient(180deg, rgba(15,23,42,.85), rgba(17,27,45,.75));
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    transition: transform .08s ease, border-color .2s ease, box-shadow .2s ease;
    box-shadow: 0 10px 30px rgba(0,0,0,.18);
    display: flex; flex-direction: column; gap: 10px;
  }
  .card:hover { transform: translateY(-2px); border-color: #2a3a55; box-shadow: 0 14px 36px rgba(0,0,0,.25); }
  .card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .card-title { font-weight: 700; font-size: 15px; }
  .badge { display: inline-flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 999px; font-size: 12px; background: rgba(59,130,246,.12); color: #cfe3ff; border: 1px solid rgba(59,130,246,.25); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px rgba(16,185,129,.7); }
  .desc { color: var(--muted); font-size: 13px; line-height: 1.45; }
  .links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .link {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; text-decoration: none; border: 1px solid transparent;
  }
  .link.primary { background: rgba(59,130,246,.14); color: #e8f1ff; border-color: rgba(59,130,246,.35); }
  .link.primary:hover { background: rgba(59,130,246,.25); }
  .link.secondary { background: rgba(148,163,184,.08); color: #e6e9ef; border-color: rgba(148,163,184,.18); }
  .link.secondary:hover { background: rgba(148,163,184,.14); }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>Projetos EPQ</h1>
        <p>Visão unificada dos projetos publicados em HTML.</p>
      </div>
      <div class="badge"><span class="dot"></span> Publicado</div>
    </header>

    <div class="board" id="board"></div>
  </div>

  <script>
    const projetos = [
      {
        nome: "Painel Semanal",
        descricao: "Agenda, pipeline, metas, relatórios e conteúdo do EPQ.",
        link: "https://flavio-guedes.github.io/painel-semanal/pipeline_hermes.html"
      },
      {
        nome: "Central EPQ",
        descricao: "Hub dos painéis EPQ em estilo Dark Futuristic.",
        link: "https://flavio-guedes.github.io/epq-central/"
      },
      {
        nome: "Painel Pedagógico",
        descricao: "Gestão pedagógica: turnos, turmas, professores e salas.",
        link: "https://flavio-guedes.github.io/pedagogico/"
      },
      {
        nome: "Fluxo Comercial",
        descricao: "Pipeline comercial com métricas, funil e follow-up.",
        link: "https://flavio-guedes.github.io/epq/fluxocomercial.html"
      },
      {
        nome: "Playbook de Atendimento",
        descricao: "Playbook com scripts, etapas e destaque PMERJ.",
        link: "https://flavio-guedes.github.io/epq/playbookatendimento.html"
      },
      {
        nome: "Página do Aulão",
        descricao: "Campanha do aulão: Direito Penal e Administrativo.",
        link: "https://flavio-guedes.github.io/epq/planodivulgacao-aulao.html"
      },
      {
        nome: "B2B Opportunity Finder",
        descricao: "Prospecção B2B com busca, base e exportação CSV.",
        link: "https://flavio-guedes.github.io/b2b-opportunity-finder/"
      }
    ];

    const board = document.getElementById('board');
    projetos.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-top">
          <div class="card-title">${p.nome}</div>
          <div class="badge"><span class="dot"></span> Publicado</div>
        </div>
        <div class="desc">${p.descricao}</div>
        <div class="links">
          <a class="link primary" href="${p.link}" target="_blank" rel="noopener">Abrir painel</a>
        </div>
      `;
      board.appendChild(card);
    });
  </script>
</body>
</html>
