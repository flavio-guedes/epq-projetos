<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EPQ — Painel de Imagens</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111c33;
      --text: #eef2ff;
      --muted: #9aa4c7;
      --border: #1f2d4d;
      --accent: #ff4d6d;
      --accent-2: #845ef7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif; background: radial-gradient(1200px 800px at 10% -10%,#1a2744, transparent), var(--bg); color: var(--text); min-height: 100vh; }
    a { color: inherit; text-decoration: none; }

    header { position: sticky; top: 0; z-index: 20; backdrop-filter: blur(10px); background: rgba(11,18,32,0.6); border-bottom: 1px solid var(--border); }
    .bar { max-width: 1200px; margin: 0 auto; padding: 18px 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: 0.3px; font-size: 18px; }
    .brand-mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: white; font-weight: 900; font-size: 14px; }
    .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .pill { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); font-size: 12px; }
    .pill.active { border-color: var(--accent-2); color: #fff; background: linear-gradient(135deg,#2a1b55,#1e1145); }

    main { max-width: 1200px; margin: 0 auto; padding: 22px; }
    .toolbar { display: grid; gap: 12px; grid-template-columns: 1fr auto auto auto; align-items: end; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.4px; text-transform: uppercase; }
    input, select { background: #0b1220; color: var(--text); border: 1px solid var(--border); padding: 10px 12px; border-radius: 10px; outline: none; font-size: 14px; }
    input:focus, select:focus { border-color: var(--accent-2); box-shadow: 0 0 0 3px rgba(132,94,247,0.15); }
    .btn { border: none; color: white; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .btn.secondary { background: linear-gradient(135deg, #25335c, #1e2a50); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0 8px; }
    .stat { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0)); border: 1px solid var(--border); padding: 14px; border-radius: 14px; }
    .stat .num { font-size: 22px; font-weight: 800; background: linear-gradient(180deg,#fff,#c9c7ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; margin-top: 18px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: transform .12s ease, box-shadow .12s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 20px 40px rgba(0,0,0,0.35); }
    .media { position: relative; aspect-ratio: 1/1; background: #0a1020; display: grid; place-items: center; overflow: hidden; }
    .media img { width: 100%; height: 100%; object-fit: cover; }
    .ratio-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.55); backdrop-filter: blur(6px); color: #fff; font-size: 11px; padding: 4px 8px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.08); }
    .body { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .title { font-size: 14px; font-weight: 700; color: #e9ecff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { font-size: 11px; padding: 4px 8px; border-radius: 999px; background: #101a30; border: 1px solid #1f2d4d; color: #b7c0e0; }
    .actions { display: flex; gap: 8px; margin-top: 4px; }
    .link { flex: 1; text-align: center; padding: 8px; border-radius: 10px; background: linear-gradient(135deg,#1f2d4d,#1a2440); color: #dde3ff; font-weight: 700; font-size: 12px; border: 1px solid #25335c; }

    .pager { display: flex; justify-content: center; gap: 8px; margin: 24px 0 40px; }
    .pager button { background: #0f172a; border: 1px solid #25335c; color: #dde3ff; padding: 8px 12px; border-radius: 10px; cursor: pointer; }
    .pager button.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; }

    .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; z-index: 50; backdrop-filter: blur(4px); }
    .modal-bg.show { display: flex; }
    .modal { background: linear-gradient(180deg,#111c33,#0b1220); border: 1px solid #25335c; border-radius: 18px; max-width: 1000px; width: 92%; max-height: 92vh; overflow: hidden; display: flex; flex-direction: column; }
    .modal-head { padding: 16px 18px; border-bottom: 1px solid #1f2d4d; display: flex; align-items: center; justify-content: space-between; }
    .modal-body { padding: 18px; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .modal img { width: 100%; border-radius: 14px; border: 1px solid #1f2d4d; }
    .info { display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: #c7cde0; }
    .info .k { color: #7c86a8; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    .info .v { color: #eef2ff; word-break: break-word; }
    .empty { text-align: center; padding: 60px 10px; color: var(--muted); }

    @media (max-width: 860px) {
      .toolbar { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .modal-body { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <div class="brand"><div class="brand-mark">EPQ</div> Painel de Imagens</div>
      <div class="pills">
        <span class="pill" id="pill-all" onclick="setAspect('')">Todas</span>
        <span class="pill" onclick="setAspect('1:1')">Feed 1:1</span>
        <span class="pill" onclick="setAspect('4:5')">Feed 4:5</span>
        <span class="pill" onclick="setAspect('9:16')">Stories</span>
        <span class="pill" onclick="setAspect('16:9')">16:9</span>
      </div>
    </div>
  </header>

  <main>
    <div class="stats">
      <div class="stat"><div class="num" id="s-total">-</div><div class="lbl">Imagens</div></div>
      <div class="stat"><div class="num" id="s-openai">-</div><div class="lbl">OpenAI</div></div>
      <div class="stat"><div class="num" id="s-polli">-</div><div class="lbl">Pollinations</div></div>
      <div class="stat"><div class="num" id="s-fal">-</div><div class="lbl">Fal.ai</div></div>
    </div>

    <div class="toolbar">
      <div class="field">
        <label>Buscar</label>
        <input id="q" placeholder="Buscar por prompt, provedor ou nome…" />
      </div>
      <div class="field">
        <label>Provedor</label>
        <select id="provider">
          <option value="">Todos</option>
          <option value="openai">OpenAI</option>
          <option value="pollinations">Pollinations</option>
          <option value="fal">Fal.ai</option>
        </select>
      </div>
      <div class="field">
        <label>Formato</label>
        <select id="aspect">
          <option value="">Todos</option>
          <option value="1:1">1:1</option>
          <option value="4:5">4:5</option>
          <option value="9:16">9:16</option>
          <option value="16:9">16:9</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button class="btn" onclick="applyFilters()">Filtrar</button>
      </div>
    </div>

    <div class="grid" id="grid"></div>
    <div class="pager" id="pager"></div>
  </main>

  <div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head">
        <div style="font-weight:800">Detalhes da imagem</div>
        <button class="btn secondary" onclick="closeModal()">Fechar</button>
      </div>
      <div class="modal-body">
        <div><img id="m-img" src="" alt="preview" /></div>
        <div class="info" id="m-info"></div>
      </div>
    </div>
  </div>

  <script>
    let state = { q: "", provider: "", aspect: "", page: 1 };
    const API = "/index.json";

    function pillActive(sel) {
      document.querySelectorAll('.pill').forEach(el => el.classList.toggle('active', el.getAttribute('onclick')?.includes(`'${sel}'`)));
    }

    function setAspect(v) {
      state.aspect = v;
      document.getElementById('aspect').value = v;
      pillActive(v);
      state.page = 1;
      load();
    }

    function applyFilters() {
      state.q = document.getElementById('q').value.trim();
      state.provider = document.getElementById('provider').value;
      state.page = 1;
      load();
    }

    async function load() {
      const p = new URLSearchParams();
      if (state.q) p.set('q', state.q);
      if (state.provider) p.set('provider', state.provider);
      if (state.aspect) p.set('aspect', state.aspect);
      p.set('page', String(state.page));
      p.set('per_page', '30');
      const r = await fetch(`${API}?${p.toString()}`);
      const data = await r.json();
      render(data);
    }

    function render(data) {
      document.getElementById('s-total').textContent = data.total;
      const counts = { openai: 0, pollinations: 0, fal: 0 };
      (data.items || []).forEach(it => { const p = (it.provider || '').toLowerCase(); if (p in counts) counts[p]++; });
      document.getElementById('s-openai').textContent = counts.openai;
      document.getElementById('s-polli').textContent = counts.pollinations;
      document.getElementById('s-fal').textContent = counts.fal;

      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      if (!data.items.length) {
        grid.innerHTML = '<div class="empty">Nenhuma imagem encontrada.</div>';
        document.getElementById('pager').innerHTML = '';
        return;
      }
      data.items.forEach(it => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="media">
            <img src="${it.url || '/images/' + it.filename}" alt="${it.filename}" loading="lazy" />
            <div class="ratio-badge">${it.ratio || ''} ${it.aspect || ''}</div>
          </div>
          <div class="body">
            <div class="title">${escapeHtml(it.original_prompt || it.filename)}</div>
            <div class="meta">
              <span class="tag">${it.provider || ''}</span>
              <span class="tag">${it.model || ''}</span>
              <span class="tag">${it.aspect || ''}</span>
            </div>
            <div class="actions">
              <a class="link" href="${it.url || '/images/' + it.filename}" download>Baixar</a>
              <a class="link" href="javascript:void(0)" onclick="openModal('${it.filename}')">Detalhes</a>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      const pages = Math.max(1, data.pages || 1);
      const pager = document.getElementById('pager');
      pager.innerHTML = '';
      if (pages > 1) {
        pager.innerHTML += `<button ${state.page<=1?'disabled':''} onclick="goPage(${state.page-1})">« Anterior</button>`;
        for (let i=1;i<=pages;i++) pager.innerHTML += `<button class="${i===state.page?'active':''}" onclick="goPage(${i})">${i}</button>`;
        pager.innerHTML += `<button ${state.page>=pages?'disabled':''} onclick="goPage(${state.page+1})">Próxima »</button>`;
      }
    }

    function goPage(n) { state.page = n; load(); }
    function escapeHtml(s) { return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function openModal(filename) {
      const p = new URLSearchParams(); if (state.q) p.set('q', state.q); if (state.provider) p.set('provider', state.provider); if (state.aspect) p.set('aspect', state.aspect); p.set('page','1'); p.set('per_page','100');
      const r = await fetch(`${API}?${p.toString()}`); const data = await r.json();
      const item = (data.items || []).find(x => x.filename === filename);
      if (!item) return;
      document.getElementById('m-img').src = item.url || '/images/' + item.filename;
      const info = document.getElementById('m-info');
      const rows = [
        ['Arquivo', item.filename],
        ['Provedor', item.provider],
        ['Modelo', item.model],
        ['Formato', item.aspect],
        ['Tamanho', (item.size_bytes ? Math.round(item.size_bytes/1024)+' KB' : '-')],
        ['Dimensões', `${item.width}×${item.height}`],
        ['Prompt original', item.original_prompt],
        ['Prompt final', item.enhanced_prompt],
        ['Caminho', item.path],
        ['Status', item.status],
      ];
      info.innerHTML = rows.map(([k,v]) => `<div><div class="k">${k}</div><div class="v">${escapeHtml(v||'-')}</div></div>`).join('');
      document.getElementById('modal').classList.add('show');
    }
    function closeModal() { document.getElementById('modal').classList.remove('show'); }

    document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') applyFilters(); });
    load();
  </script>
</body>
</html>
