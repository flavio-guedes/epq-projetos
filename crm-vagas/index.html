<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRM de Vagas</title>
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --elevated: #f3f4f6;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --accent: #10b981;
    --accent-2: #059669;
    --accent-3: #34d399;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #3b82f6;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 26px; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 999px;
    background: rgba(16,185,129,.12);
    color: #065f46;
    border: 1px solid rgba(16,185,129,.25);
    font-size: 13px;
    font-weight: 700;
  }
  .filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .filter {
    padding: 8px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease;
  }
  .filter:hover { background: var(--elevated); border-color: #d1d5db; }
  .filter.active { background: #ecfdf5; border-color: #10b981; color: #065f46; font-weight: 700; }

  /* KPI strip */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 18px;
  }
  @media (max-width: 860px) { .kpi-strip { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .kpi-strip { grid-template-columns: 1fr; } }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    transition: transform .08s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .kpi:hover { transform: translateY(-2px); border-color: #d1d5db; box-shadow: 0 10px 26px rgba(0,0,0,.06); }
  .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .12em; }
  .kpi .value { margin-top: 8px; font-size: 22px; font-weight: 700; }
  .kpi .meta { margin-top: 6px; color: var(--muted); font-size: 13px; }

  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    transition: transform .08s ease, border-color .2s ease, box-shadow .2s ease;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card:hover { transform: translateY(-2px); border-color: #d1d5db; box-shadow: 0 10px 28px rgba(0,0,0,.06); }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .company { margin: 0; color: var(--muted); font-size: 13px; }
  .context { margin: 0; color: #4b5563; font-size: 14px; line-height: 1.55; }
  .actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--elevated);
    color: var(--text);
    text-decoration: none;
    font-size: 13px;
    transition: background .15s ease, border-color .15s ease;
  }
  .btn:hover { background: #e5e7eb; border-color: #d1d5db; }
  .btn.primary { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
  .btn.primary:hover { background: #d1fae5; }

  /* Status */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    width: fit-content;
  }
  .status.sent { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
  .status.followup { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
  .status.no_response { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  .status.closed { background: #f3f4f6; color: #374151; border: 1px solid #d1d5db; }
  .status-dot { width: 8px; height: 8px; border-radius: 999px; background: currentColor; }

  footer {
    margin-top: 34px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding-bottom: 10px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand">CRM de Vagas</div>
    <div class="filters">
      <button class="filter active" data-filter="all" onclick="filterCards('all')">Todos</button>
      <button class="filter" data-filter="sent" onclick="filterCards('sent')">Enviado</button>
      <button class="filter" data-filter="followup" onclick="filterCards('followup')">Follow-up</button>
      <button class="filter" data-filter="no_response" onclick="filterCards('no_response')">Sem resposta</button>
      <button class="filter" data-filter="closed" onclick="filterCards('closed')">Encerrado</button>
    </div>
  </div>

  <section>
    <div class="kpi-strip">
      <div class="kpi">
        <div class="label">Total</div>
        <div class="value" id="kpi-total">0</div>
        <div class="meta">Vagas no painel</div>
      </div>
      <div class="kpi">
        <div class="label">Enviado</div>
        <div class="value" id="kpi-sent">0</div>
        <div class="meta">Aguardando retorno</div>
      </div>
      <div class="kpi">
        <div class="label">Follow-up</div>
        <div class="value" id="kpi-followup">0</div>
        <div class="meta">Em andamento</div>
      </div>
      <div class="kpi">
        <div class="label">Sem resposta</div>
        <div class="value" id="kpi-no_response">0</div>
        <div class="meta">Sem retorno</div>
      </div>
    </div>
  </section>

  <section>
    <div class="grid" id="cards"></div>
  </section>

  <footer>
    Painel CRM de vagas — status, contexto e acompanhamento.
  </footer>
</div>

<script>
  const vagas = [
    {
      title: 'UX/UI/Product Designer',
      company: 'TSC Consultoria',
      context: 'Vaga remota com foco em design de interfaces, prototipação, design systems, pesquisa com usuários, acessibilidade e metodologias ágeis.',
      url: 'https://wa.me/5511982756522?text=Ol%C3%A1%21%0A%0AVi%20a%20vaga%20de%20UX%2FUI%2FProduct%20Designer%20na%20TSC%20Consultoria%20e%20gostaria%20de%20me%20candidatar.%0A%0ATenho%20experi%C3%AAncia%20com%20design%20de%20interfaces%2C%20prototipa%C3%A7%C3%A3o%2C%20design%20systems%2C%20pesquisa%20com%20usu%C3%A1rios%2C%20acessibilidade%20e%20metodologias%20%C3%A1geis.%0A%0ADomino%20Figma%20e%20ferramentas%20de%20IA%20aplicadas%20ao%20design.%0A%0ASegue%20meu%20curr%C3%ADculo%20e%20portf%C3%B3lio%20para%20avalia%C3%A7%C3%A3o.%3A%20https%3A%2F%2Fflavio-guedes.github.io%2Fportfolio%2Fdesignhead.html'
    },
    {
      title: 'UX/UI Designer Júnior',
      company: 'Remota — código L102',
      context: 'Vaga júnior 100% remota, sem experiência profissional exigida. Salário inicial por volta de R$ 5.917.',
      url: 'https://wa.me/5511914123181?text=Ol%C3%A1%21%0A%0AVi%20a%20vaga%20de%20UX%2FUI%20Designer%20J%C3%BAnior%20remota%20e%20gostaria%20de%20me%20candidatar.%0A%0ATenho%20experi%C3%AAncia%20com%20design%20de%20interfaces%2C%20prototipa%C3%A7%C3%A3o%2C%20design%20systems%2C%20pesquisa%20com%20usu%C3%A1rios%2C%20acessibilidade%20e%20metodologias%20%C3%A1geis.%0A%0ADomino%20Figma%20e%20ferramentas%20de%20IA%20aplicadas%20ao%20design.%0A%0ASegue%20meu%20curr%C3%ADculo%20e%20portf%C3%B3lio%20para%20avalia%C3%A7%C3%A3o.%3A%20https%3A%2F%2Fflavio-guedes.github.io%2Fportfolio%2Fdesignhead.html'
    },
    {
      title: 'Customer Success / Vendas B2B em Tech',
      company: 'Não informado na publicação',
      context: 'Foco em saúde mental de colaboradores, atendimento empático, escuta ativa, persuasão e acompanhamento de clientes.',
      url: 'https://wa.me/5591984166870?text=Ol%C3%A1%21%0A%0AVi%20a%20vaga%20de%20Customer%20Success%20%2F%20Vendas%20B2B%20em%20tecnologia%20e%20gostaria%20de%20me%20candidatar.%0A%0ATenho%20experi%C3%AAncia%20com%20atendimento%20ao%20cliente%2C%20comunica%C3%A7%C3%A3o%20emp%C3%A1tica%2C%20escuta%20ativa%20e%20persuas%C3%A3o.%0A%0ATenho%20familiaridade%20com%20CRM%20e%20processos%20de%20acompanhamento%20de%20clientes.%0A%0ASegue%20meu%20curr%C3%ADculo%20para%20avalia%C3%A7%C3%A3o.'
    },
    {
      title: 'UX Designer Pleno — 100% remoto',
      company: 'DOMVS iT',
      context: 'Vaga pleno no setor de seguros, com foco em produtos digitais de alto impacto. Autonomia, ambiente colaborativo e transformação digital.',
      url: 'https://wa.me/5511911876264?text=Ol%C3%A1%21%0A%0AVi%20a%20vaga%20de%20UX%20Designer%20Pleno%20na%20DOMVS%20iT%20e%20gostaria%20de%20me%20candidatar.%0A%0ATenho%20experi%C3%AAncia%20com%20design%20de%20interfaces%2C%20prototipa%C3%A7%C3%A3o%2C%20design%20systems%2C%20pesquisa%20com%20usu%C3%A1rios%2C%20acessibilidade%20e%20metodologias%20%C3%A1geis.%0A%0ADomino%20Figma%20e%20ferramentas%20de%20IA%20aplicadas%20ao%20design.%0A%0ASegue%20meu%20curr%C3%ADculo%20e%20portf%C3%B3lio%20para%20avalia%C3%A7%C3%A3o.%3A%20https%3A%2F%2Fflavio-guedes.github.io%2Fportfolio%2Fdesignhead.html'
    },
    {
      title: 'Customer Success Analyst',
      company: 'Garantiza',
      context: 'Vaga presencial em Curitiba/PR, PJ, com foco em análise de métricas, NPS, churn e LTV. Benefícios: Wellhub, plataforma Keiken e ambiente flexível.',
      url: 'https://wa.me/5541997242826?text=Ol%C3%A1%21%0A%0AVi%20a%20vaga%20de%20Customer%20Success%20Analyst%20na%20Garantiza%20e%20gostaria%20de%20me%20candidatar.%0A%0ATenho%20experi%C3%AAncia%20com%20an%C3%A1lise%20de%20m%C3%A9tricas%2C%20relacionamento%20com%20cliente%20e%20foco%20em%20redu%C3%A7%C3%A3o%20de%20churn.%0A%0ATenho%20familiaridade%20com%20NPS%2C%20LTV%20e%20processos%20de%20acompanhamento%20de%20cliente.%0A%0ASegue%20meu%20curr%C3%ADculo%20para%20avalia%C3%A7%C3%A3o.'
    }
  ];

  function render() {
    const cards = document.getElementById('cards');
    cards.innerHTML = vagas.map((v, i) => `
      <div class="card">
        <div class="card-header">
          <div>
            <h3>${v.title}</h3>
            <div class="company">${v.company}</div>
          </div>
        </div>
        <div class="context">${v.context}</div>
        <div class="actions">
          <a class="btn primary" href="${v.url}" target="_blank">Abrir WhatsApp</a>
          <button class="btn" onclick="updateStatus(this, 'followup', ${i})">Follow-up</button>
          <button class="btn" onclick="updateStatus(this, 'no_response', ${i})">Sem resposta</button>
          <button class="btn" onclick="updateStatus(this, 'closed', ${i})">Encerrado</button>
        </div>
      </div>
    `).join('');
    refreshKpis();
  }

  function updateStatus(btn, status, index) {
    const card = btn.closest('.card');
    const companyEl = card.querySelector('.company');
    const existing = card.querySelector('.status');
    if (existing) existing.remove();

    const statusEl = document.createElement('div');
    statusEl.className = 'status ' + status;
    statusEl.innerHTML = '<div class="status-dot"></div>' + statusLabels[status];
    card.insertBefore(statusEl, companyEl);
    refreshKpis();
  }

  const statusLabels = {
    sent: 'Enviado',
    followup: 'Follow-up',
    no_response: 'Sem resposta',
    closed: 'Encerrado'
  };

  function filterCards(status) {
    document.querySelectorAll('.filter').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('[data-filter="' + status + '"]').forEach(el => el.classList.add('active'));
    document.querySelectorAll('.card').forEach(card => {
      const current = card.getAttribute('data-status');
      if (status === 'all' || current === status) {
        card.style.display = '';
      } else {
        card.style.display = 'none';
      }
    });
  }

  function refreshKpis() {
    const cards = Array.from(document.querySelectorAll('.card'));
    const counts = { total: cards.length, sent: 0, followup: 0, no_response: 0, closed: 0 };
    cards.forEach(card => {
      const statusEl = card.querySelector('.status');
      const text = statusEl ? statusEl.textContent.trim() : '';
      const key = Object.keys(statusLabels).find(k => statusLabels[k] === text);
      if (key) counts[key]++;
    });
    document.getElementById('kpi-total').textContent = counts.total;
    document.getElementById('kpi-sent').textContent = counts.sent;
    document.getElementById('kpi-followup').textContent = counts.followup;
    document.getElementById('kpi-no_response').textContent = counts.no_response;
  }

  render();
</script>
</body>
</html>
